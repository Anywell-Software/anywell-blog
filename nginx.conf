server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets — cache long-term (Astro emits these under /_astro/)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt und manifest direkt ausliefern
    location ~* \.(txt|json|ico|svg|png)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Keine Logs für Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}